serviceAccountId=aaa
serviceAccountPkFile=c:\\1\\privatekey.p12
timestampFile=c:\\1\\users.properties
domain=foo.com
oldestDate=2013-06-11

# The mailboxes to back up are listed through the Admin SDK Directory API rather than configured
# here. adminUser is the super administrator to impersonate for that call, and is required: the
# Directory API has no notion of a service account of its own. The service account also needs
# https://www.googleapis.com/auth/admin.directory.user.readonly on its entry under
# Admin console > Security > API controls > Domain-wide delegation.
adminUser=admin@foo.com
# Mailboxes to skip even though the Directory lists them: shared, service and role accounts.
usersExclude=noreply,info
# The last list the Directory answered with, reused if a later lookup fails - if there is no
# cached list either, the run fails rather than backing up nobody. Defaults to users.cache in the
# folder the application runs from, so it normally needs no setting at all.
#userCacheFile=c:\\1\\users.cache

ignoreFrom=user3@goo.com,user4@foo.com
dataDir=x:\\var\\gmail
